services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db

  demo:
    build:
      context: .
      target: demo
    ports:
      - "7860:7860"
    environment:
      - RAG_API_URL=http://app:8000
      - DEMO_HOST=0.0.0.0
    depends_on:
      app:
        condition: service_healthy

volumes:
  ollama_data:
  chroma_data:
